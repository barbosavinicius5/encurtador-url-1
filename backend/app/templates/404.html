<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link não encontrado – Encurtador de URL</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #1a202c;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            color: #4299e1;
            margin-bottom: 2rem;
            letter-spacing: 0.025em;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #e2e8f0;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 0.75rem;
        }

        .description {
            font-size: 0.9375rem;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }

        .hint {
            font-size: 0.875rem;
            color: #a0aec0;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            min-height: 44px;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #ffffff;
            background: #4299e1;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .back-link:hover {
            background: #3182ce;
        }

        .back-link:focus {
            outline: 3px solid rgba(66, 153, 225, 0.5);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.25rem;
            }

            .error-code {
                font-size: 4rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .description {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <div class="brand" aria-label="Encurtador de URL">Encurtador de URL</div>
        <div class="error-code" aria-hidden="true">404</div>
        <h1>Link não encontrado</h1>
        <p class="description">Este link não existe ou foi removido.</p>
        <p class="hint">
            Verifique se o endereço está correto ou entre em contato com quem enviou o link.
        </p>
        <a href="/" class="back-link" aria-label="Voltar à página inicial">
            ← Voltar à página inicial
        </a>
    </main>
</body>
</html>
