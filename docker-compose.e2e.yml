version: "3.9"

# Ambiente Docker isolado para testes E2E
# Usa banco de dados e porta separados do ambiente de desenvolvimento
# para evitar conflitos e garantir isolamento completo.
#
# Uso:
#   docker-compose -f docker-compose.e2e.yml up -d
#   docker-compose -f docker-compose.e2e.yml down -v  # limpa volumes

services:
  app-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-e2e:5432/urlshortener_e2e
      REDIS_URL: redis://redis-e2e:6379/0
      BASE_URL: http://localhost:8001
      ENVIRONMENT: test
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || curl -f http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  postgres-e2e:
    image: postgres:15-alpine
    ports:
      - "5456:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener_e2e
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-e2e:
    image: redis:7-alpine
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_e2e_data:
    # Volume separado do desenvolvimento para isolamento completo
    name: encurtador_e2e_postgres_data
